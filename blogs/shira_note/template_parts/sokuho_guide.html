<!-- wp:html -->
<aside role="region" aria-label="{{記事名}} 速報ガイド" style="display: block; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; background: #ffffff; color: #333333; border: 1px solid #e0e0e0; border-radius: 4px; overflow: hidden; position: relative; max-width: 100%; margin: 10px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">

  <div style="position: relative; background: #0a0b22; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f2c230;">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #f2c230;">{{企画名と回}}</div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 600; color: #fff; border-left: 1px solid rgba(242, 194, 48, 0.4); padding-left: 10px; white-space: nowrap;">
      {{月/日}} 放送分
    </div>
  </div>

  <div style="position: relative; padding: 20px 12px; display: grid; gap: 15px;">

    <div style="display: flex; align-items: flex-start; gap: 8px;">
      <div style="flex-shrink: 0; font-size: 8px; font-weight: 700; border: 1px solid #0a0b22; color: #0a0b22; padding: 2px 4px; letter-spacing: 0.02em; width: 48px; text-align: center; margin-top: 2px;">放送日</div>
      <div style="flex: 1;">
        <span style="font-size: clamp(15.5px, calc(15.5px + (100vw - 480px) / 240), 20px); font-weight: 700; color: #0a0b22; display: block; margin-bottom: 4px; white-space: nowrap; letter-spacing: -0.02em;">{{YYYY.MM.DD (曜) HH:MM - HH:MM}}</span>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px;">
          <span style="color: #e3262a; font-size: 10.5px; font-weight: 800;">{{放送局}} 生放送</span>
          <span style="color: #666; font-size: 10px;">{{番組の正式名称}}</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 8px;">
      <div style="flex-shrink: 0; font-size: 8px; font-weight: 700; border: 1px solid #0a0b22; color: #0a0b22; padding: 2px 4px; letter-spacing: 0.02em; width: 48px; text-align: center; margin-top: 1px;">発表状況</div>
      <div style="flex: 1; font-size: 12.5px; font-weight: 700; color: #333; line-height: 1.5;">
        {{発表状況を1行で}}
        <div style="font-size: 10px; font-weight: 500; color: #666; margin-top: 3px;">{{補足1行}}</div>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 8px;">
      <div style="flex-shrink: 0; font-size: 8px; font-weight: 700; background: #d4a017; color: #fff; padding: 2px 4px; letter-spacing: 0.02em; width: 48px; text-align: center; margin-top: 1px;">過去の目安</div>
      <div style="flex: 1; font-size: 12.5px; font-weight: 700; color: #333; line-height: 1.5;">
        {{過去の目安を1行で}}
        <div style="font-size: 10px; font-weight: 500; color: #666; margin-top: 3px;">{{根拠の補足}}</div>
      </div>
    </div>

    <div style="background: rgba(227, 38, 42, 0.04); border-left: 3px solid #e3262a; padding: 8px 10px;">
      <div style="font-size: 10.5px; color: #e3262a; font-weight: 800; margin-bottom: 2px;">
        {{目立たせたい情報1行}}
      </div>
      <div style="font-size: 9px; font-weight: 500; color: #888;">
        {{補足1行}}
      </div>
    </div>

  </div>

  <div style="background: #fcfcfc; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee;">
    <div style="color: #999; font-size: 9px;">Update: {{YYYY.MM.DD}}</div>
    <a href="#st-toc-h-1" style="display: inline-flex; align-items: center; background: #e3262a; color: #fff; text-decoration: none; font-size: 10.5px; font-weight: 800; padding: 5px 12px; border-radius: 20px; box-shadow: 0 4px 10px rgba(227, 38, 42, 0.2);">
      詳細を確認 <span style="margin-left: 4px; font-size: 11px;">↓</span>
    </a>
  </div>

</aside>
<!-- /wp:html -->
